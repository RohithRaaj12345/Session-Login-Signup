<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - User System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">User System</a>
            <div class="ms-auto d-flex align-items-center gap-3">
                <span class="navbar-text text-white">
                    Welcome, <span id="displayUsername"></span>
                </span>
                <button class="btn btn-outline-light btn-sm" id="logoutBtn">Logout</button>
            </div>
        </div>
    </nav>

    <div class="profile-wrapper">
        <div class="profile-container">
            <div id="alertMessage"></div>

            <!-- Top user info card -->
            <div class="profile-info-card">
                <div class="profile-info-banner"></div>
                <div class="profile-info-body">
                    <div class="profile-avatar">
                        <span id="avatarInitial"></span>
                    </div>
                    <h3 id="username"></h3>
                    <div class="profile-email" id="email"></div>
                </div>
            </div>

            <!-- Edit form card -->
            <div class="profile-edit-card">
                <div class="profile-edit-header">
                    <h5>Profile Details</h5>
                </div>
                <div class="profile-edit-body">
                    <form id="profileForm">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="age" class="form-label">Age</label>
                                <input type="number" class="form-control" id="age" min="1" max="150">
                            </div>

                            <div class="col-md-6 mb-3">
                                <label for="dob" class="form-label">Date of Birth</label>
                                <input type="date" class="form-control" id="dob">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="contact" class="form-label">Contact Number</label>
                            <input type="tel" class="form-control" id="contact" placeholder="+91 1234567890">
                        </div>

                        <div class="mb-3">
                            <label for="address" class="form-label">Address</label>
                            <textarea class="form-control" id="address" rows="3"></textarea>
                        </div>

                        <div class="mb-3">
                            <label for="bio" class="form-label">Bio</label>
                            <textarea class="form-control" id="bio" rows="4" placeholder="Tell us about yourself..."></textarea>
                        </div>

                        <button type="submit" class="btn btn-primary" id="updateBtn">
                            Update Profile
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/profile.js"></script>
</body>
</html>
